<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Taskly - Register</title>
  <link rel="stylesheet" href="../css/register.css" />
</head>
<body>
  <div class="registerContainer">
    <h1>Taskly</h1>
    <p class="subheading">Create your account</p>
    <form id="registerForm">
      <label for="registerName">Username:</label>
      <input type="text" id="registerName" placeholder="Enter your name" required />
      <label for="registerEmail">Email:</label>
      <input type="email" id="registerEmail" placeholder="Enter your email" required />
      <label for="registerPassword">Password:</label>
      <input type="password" id="registerPassword" placeholder="Enter password" required />
      <label for="registerConfirm">Confirm Password:</label>
      <input type="password" id="registerConfirm" placeholder="Confirm password" required />

      <p id="registerError" class="errorMsg"></p>
      <button type="submit">Create Account</button>
    </form>
    <p class="form-footer">Already have an account? <a href="/pages/login.html">Login</a></p>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
